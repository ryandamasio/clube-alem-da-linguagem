<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 808 714" role="img" aria-labelledby="t">
  <title id="t">Materiais do Clube: artigos científicos, grupo exclusivo de WhatsApp e aulas bônus</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7e3e6"/>
      <stop offset="1" stop-color="#ecd2d8"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6a1532"/>
      <stop offset="1" stop-color="#470e22"/>
    </linearGradient>
    <linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a81741"/>
      <stop offset="1" stop-color="#d81a4f"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#470e22" flood-opacity=".22"/>
    </filter>
    <clipPath id="screen"><rect x="292" y="96" width="224" height="470" rx="30"/></clipPath>
  </defs>

  <rect width="808" height="714" rx="18" fill="url(#bg)"/>
  <circle cx="660" cy="120" r="150" fill="#fff" opacity=".35"/>
  <circle cx="120" cy="620" r="170" fill="#fff" opacity=".3"/>

  <!-- Card: artigo científico -->
  <g filter="url(#sh)" transform="rotate(-6 170 300)">
    <rect x="58" y="170" width="250" height="290" rx="16" fill="#fbf7f3"/>
    <rect x="58" y="170" width="250" height="56" rx="16" fill="url(#wine)"/>
    <rect x="58" y="206" width="250" height="20" fill="url(#wine)"/>
    <text x="82" y="205" font-family="Georgia, serif" font-size="20" fill="#fff3f4">Artigo selecionado</text>
    <rect x="82" y="250" width="200" height="10" rx="5" fill="#470e22" opacity=".85"/>
    <rect x="82" y="270" width="160" height="10" rx="5" fill="#470e22" opacity=".85"/>
    <rect x="82" y="300" width="200" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="316" width="190" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="332" width="200" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="348" width="140" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="374" width="200" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="390" width="170" height="7" rx="3.5" fill="#c9a6b1"/>
    <rect x="82" y="416" width="92" height="26" rx="13" fill="#f6d3dc"/>
    <text x="96" y="434" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b8124c">RESUMO</text>
    <rect x="182" y="416" width="64" height="26" rx="13" fill="#f6d3dc"/>
    <text x="198" y="434" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b8124c">PDF</text>
  </g>

  <!-- Celular: grupo exclusivo de WhatsApp -->
  <g filter="url(#sh)">
    <rect x="280" y="80" width="248" height="502" rx="40" fill="#260c16"/>
    <g clip-path="url(#screen)">
      <rect x="292" y="96" width="224" height="470" fill="#f3ece6"/>
      <rect x="292" y="96" width="224" height="72" fill="url(#wine)"/>
      <circle cx="324" cy="136" r="18" fill="#fff"/>
      <circle cx="324" cy="130" r="6" fill="#b8124c"/>
      <path d="M312 146c3-7 21-7 24 0" fill="#e9a8b7"/>
      <text x="350" y="132" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Clube Além da</text>
      <text x="350" y="149" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#fff">Linguagem</text>
      <text x="350" y="162" font-family="Arial, sans-serif" font-size="10" fill="#ffc4d4">grupo exclusivo</text>

      <rect x="304" y="186" width="160" height="58" rx="12" fill="#fff"/>
      <text x="316" y="208" font-family="Arial, sans-serif" font-size="12" fill="#260c16">Novo artigo na</text>
      <text x="316" y="225" font-family="Arial, sans-serif" font-size="12" fill="#260c16">plataforma!</text>

      <rect x="344" y="256" width="160" height="58" rx="12" fill="#f6d3dc"/>
      <text x="356" y="278" font-family="Arial, sans-serif" font-size="12" fill="#470e22">Que caso ótimo</text>
      <text x="356" y="295" font-family="Arial, sans-serif" font-size="12" fill="#470e22">pra discutir!</text>

      <rect x="304" y="326" width="176" height="96" rx="12" fill="#fff"/>
      <rect x="314" y="336" width="156" height="50" rx="8" fill="url(#wine)"/>
      <circle cx="392" cy="361" r="14" fill="#fff"/>
      <path d="M387 353l12 8-12 8z" fill="#b8124c"/>
      <text x="316" y="406" font-family="Arial, sans-serif" font-size="12" fill="#260c16">Gravação disponível</text>

      <rect x="344" y="434" width="160" height="42" rx="12" fill="#f6d3dc"/>
      <text x="356" y="460" font-family="Arial, sans-serif" font-size="12" fill="#470e22">Até o próximo encontro!</text>

      <rect x="304" y="520" width="170" height="32" rx="16" fill="#fff"/>
      <circle cx="494" cy="536" r="16" fill="url(#btn)"/>
    </g>
    <rect x="364" y="88" width="80" height="8" rx="4" fill="#111"/>
  </g>

  <!-- Card: aulas bônus -->
  <g filter="url(#sh)" transform="rotate(5 640 420)">
    <rect x="520" y="300" width="240" height="250" rx="16" fill="#fbf7f3"/>
    <rect x="536" y="316" width="208" height="122" rx="10" fill="url(#wine)"/>
    <circle cx="640" cy="377" r="28" fill="#fff"/>
    <path d="M630 362l24 15-24 15z" fill="#b8124c"/>
    <rect x="536" y="452" width="96" height="26" rx="13" fill="#f6d3dc"/>
    <text x="552" y="470" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#b8124c">BÔNUS</text>
    <text x="536" y="504" font-family="Georgia, serif" font-size="21" fill="#260c16">2 aulas bônus</text>
    <text x="536" y="528" font-family="Arial, sans-serif" font-size="13" fill="#6b4a56">Posicionamento digital e</text>
    <text x="536" y="544" font-family="Arial, sans-serif" font-size="13" fill="#6b4a56">altas habilidades</text>
  </g>

  <!-- selo -->
  <g filter="url(#sh)">
    <circle cx="138" cy="560" r="54" fill="url(#btn)"/>
    <text x="138" y="553" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff">sempre</text>
    <text x="138" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="17" fill="#fff">atualizado</text>
  </g>
</svg>
